<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">GT7 Stats profile overview mockup</title>
  <desc id="desc">Dark profile screen with driver identity, career summary, driving metrics, and world statistics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a24"/><stop offset="1" stop-color="#243445"/></linearGradient>
    <style>.h{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;fill:#f4fbff}.l{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;fill:#8fa8b8}.b{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:23px;font-weight:700;fill:#e6f3f8}.s{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#94adba}.accent{fill:#5de1c6}</style>
  </defs>
  <rect width="1440" height="900" rx="42" fill="url(#bg)"/><rect x="40" y="40" width="1360" height="820" rx="30" fill="#0d1720" stroke="#2d4655" stroke-width="2"/>
