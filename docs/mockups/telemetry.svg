<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">GT7 Stats UDP telemetry mockup</title>
  <desc id="desc">Dark live telemetry screen with speed, gear, RPM, throttle, brake, and session state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1821"/><stop offset="1" stop-color="#182d3a"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9f36b"/><stop offset="1" stop-color="#5de1c6"/></linearGradient>
    <style>.h{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;fill:#f4fbff}.l{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;fill:#8fa8b8}.b{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:23px;font-weight:700;fill:#e6f3f8}.s{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#8fa8b8}</style>
  </defs>
  <rect width="1440" height="900" rx="42" fill="url(#bg)"/><rect x="40" y="40" width="1360" height="820" rx="30" fill="#0b151e" stroke="#2d4655" stroke-width="2"/>
  <text x="92" y="112" class="l">LIVE TELEMETRY</text><text x="92" y="160" class="h" font-size="40">Kyoto Driving Park</text><text x="92" y="194" class="s">UDP connection · 59 packets/s</text><circle cx="1277" cy="128" r="10" fill="#b9f36b"/><text x="1300" y="136" class="b" font-size="20">LIVE</text>
  <rect x="92" y="244" width="390" height="292" rx="24" fill="#132832"/><text x="128" y="287" class="l">SPEED</text><text x="128" y="420" class="h" font-size="110">184</text><text x="400" y="420" class="b">KM/H</text><path d="M128 470h316" stroke="#2e4d59" stroke-width="10" stroke-linecap="round"/><path d="M128 470h244" stroke="url(#lime)" stroke-width="10" stroke-linecap="round"/><text x="128" y="510" class="s">Top speed 214 km/h</text>
  <rect x="516" y="244" width="390" height="292" rx="24" fill="#132832"/><text x="552" y="287" class="l">GEAR</text><text x="552" y="440" class="h" font-size="164">5</text><text x="750" y="395" class="s">RPM</text><text x="750" y="445" class="b" font-size="40">6,812</text><rect x="750" y="478" width="114" height="8" rx="4" fill="#b9f36b"/><rect x="868" y="478" width="12" height="8" rx="4" fill="#ff7184"/>
  <rect x="940" y="244" width="408" height="292" rx="24" fill="#132832"/><text x="976" y="287" class="l">SESSION</text><text x="976" y="350" class="b" font-size="30">Lap 04 / 08</text><text x="976" y="400" class="s">Current lap</text><text x="976" y="445" class="h" font-size="42">1:42.813</text><path d="M976 481h300" stroke="#2e4d59" stroke-width="2"/><text x="976" y="515" class="s">Delta <tspan fill="#5de1c6">-0.284</tspan></text>
  <rect x="92" y="584" width="1256" height="180" rx="24" fill="#132832"/><text x="128" y="630" class="l">INPUTS</text><text x="128" y="683" class="b">THROTTLE</text><rect x="300" y="667" width="480" height="18" rx="9" fill="#2d4655"/><rect x="300" y="667" width="360" height="18" rx="9" fill="#5de1c6"/><text x="810" y="683" class="b" fill="#5de1c6">75%</text><text x="128" y="733" class="b">BRAKE</text><rect x="300" y="717" width="480" height="18" rx="9" fill="#2d4655"/><rect x="300" y="717" width="72" height="18" rx="9" fill="#ff7184"/><text x="810" y="733" class="b" fill="#ff7184">15%</text><path d="M940 638v100" stroke="#2d4655" stroke-width="2"/><text x="990" y="675" class="s">CAR DATA</text><text x="990" y="716" class="b">Traction: active</text><text x="1195" y="716" class="b">ABS: on</text>
</svg>
