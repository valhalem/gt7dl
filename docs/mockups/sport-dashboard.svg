<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">GT7 Stats Sport Mode dashboard mockup</title>
  <desc id="desc">Dark racing dashboard with driver rating, sportsmanship rating, a performance chart, and recent race cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101923"/><stop offset="1" stop-color="#172b3a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5de1c6"/><stop offset="1" stop-color="#4ca8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;letter-spacing:2px;font-size:19px;fill:#8fa8b8;font-weight:700}.value{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:46px;fill:#f4fbff;font-weight:800}.small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;fill:#a9bfcd}.body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:23px;fill:#e6f3f8;font-weight:700}.muted{fill:#7591a0}.green{fill:#5de1c6}.blue{fill:#4ca8ff}.red{fill:#ff7184}.grid{stroke:#294352;stroke-width:2}
    </style>
  </defs>
  <rect width="1440" height="900" rx="42" fill="url(#bg)"/>
  <rect x="40" y="40" width="1360" height="820" rx="30" fill="#0d1720" stroke="#2d4655" stroke-width="2"/>
  <rect x="40" y="40" width="280" height="820" rx="30" fill="#13232d"/>
  <circle cx="105" cy="105" r="27" fill="url(#accent)"/><path d="M91 105h28M105 91v28" stroke="#0d1720" stroke-width="6" stroke-linecap="round"/>
  <text x="153" y="104" class="body">GT7 STATS</text><text x="153" y="132" class="small muted">DRIVER CONSOLE</text>
  <rect x="68" y="184" width="224" height="58" rx="16" fill="#27434e"/><circle cx="97" cy="213" r="7" class="green"/><text x="120" y="221" class="body" font-size="19">Dashboard</text>
  <circle cx="97" cy="285" r="7" fill="#557382"/><text x="120" y="293" class="small">Tracks</text>
  <circle cx="97" cy="357" r="7" fill="#557382"/><text x="120" y="365" class="small">Telemetry</text>
  <circle cx="97" cy="429" r="7" fill="#557382"/><text x="120" y="437" class="small">Profile</text>
  <path d="M68 758h224" stroke="#2b4655" stroke-width="2"/><text x="68" y="803" class="small muted">SYNC STATUS</text><text x="68" y="833" class="body" font-size="20">● Cached 2 min ago</text>
  <text x="370" y="112" class="label">SPORT MODE</text><text x="370" y="158" class="value">Performance overview</text><text x="1115" y="119" class="small">OCT 22, 2026</text>
  <rect x="370" y="202" width="300" height="150" rx="22" fill="#172b37" filter="url(#shadow)"/><text x="402" y="245" class="label">DRIVER RATING</text><text x="402" y="307" class="value">A</text><text x="485" y="307" class="small">+ 1,240 pts</text><rect x="402" y="325" width="228" height="8" rx="4" fill="#294352"/><rect x="402" y="325" width="170" height="8" rx="4" class="green"/>
  <rect x="694" y="202" width="300" height="150" rx="22" fill="#172b37" filter="url(#shadow)"/><text x="726" y="245" class="label">SPORTSMANSHIP</text><text x="726" y="307" class="value">S</text><text x="808" y="307" class="small">98 / 99</text><rect x="726" y="325" width="228" height="8" rx="4" fill="#294352"/><rect x="726" y="325" width="212" height="8" rx="4" class="blue"/>
  <rect x="1018" y="202" width="342" height="150" rx="22" fill="#172b37" filter="url(#shadow)"/><text x="1050" y="245" class="label">RACE SUMMARY</text><text x="1050" y="302" class="value" font-size="39">12 / 18</text><text x="1050" y="332" class="small">average finish · last 30 days</text>
  <rect x="370" y="382" width="626" height="382" rx="22" fill="#13242f"/><text x="402" y="430" class="body">Rating history</text><text x="402" y="459" class="small muted">Last 8 Sport Mode races</text>
  <path d="M420 686H952M420 620H952M420 554H952M420 488H952" class="grid"/><path d="M420 686L496 652L570 666L644 585L720 603L792 530L870 548L952 482" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="952" cy="482" r="8" class="green"/><text x="420" y="725" class="small muted">RACE 01</text><text x="862" y="725" class="small muted">RACE 08</text><text x="402" y="520" class="small muted">DR</text><text x="402" y="667" class="small muted">SR</text>
  <rect x="1020" y="382" width="340" height="382" rx="22" fill="#13242f"/><text x="1052" y="430" class="body">Recent races</text><text x="1052" y="459" class="small muted">Quick review</text>
  <circle cx="1068" cy="512" r="18" fill="#244a52"/><text x="1060" y="520" class="body green">1</text><text x="1105" y="508" class="body" font-size="20">Kyoto Driving Park</text><text x="1105" y="536" class="small">P1 · +420 DR</text>
  <path d="M1052 568h276" stroke="#294352" stroke-width="2"/><circle cx="1068" cy="620" r="18" fill="#244a52"/><text x="1060" y="628" class="body green">3</text><text x="1105" y="616" class="body" font-size="20">Deep Forest Raceway</text><text x="1105" y="644" class="small">P3 · +180 DR</text>
  <path d="M1052 676h276" stroke="#294352" stroke-width="2"/><circle cx="1068" cy="728" r="18" fill="#47323d"/><text x="1060" y="736" class="body red">8</text><text x="1105" y="724" class="body" font-size="20">Dragon Trail</text><text x="1105" y="752" class="small">P8 · -95 DR</text>
</svg>
